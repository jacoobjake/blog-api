extend type Query {
    "Find a single blog post by an identifying attribute."
    blog("Search by unique slug." slug: String!): Blog
        @guard
        @field(resolver: "App\\GraphQL\\Resolvers\\BlogResolver@findBlog")

    "List multiple blog posts."
    blogs(
        "Filters by author name, title, tags, and publish state."
        author: String @scope(name: "authorName")
        title: String @where(operator: "like")
        hasTags: [String!] @scope
        is_published: Boolean @eq
        orderBy: _ @orderBy(columns: ["created_at", "updated_at", "title"])
    ): [Blog!]!
        @paginate(defaultCount: 10, builder: "App\\GraphQL\\Resolvers\\BlogResolver@adminBuilder")
        @guard

    "Find a single public blog post by an identifying attribute."
    blogPublic("Search by unique slug." slug: String! @eq): BlogPublic
        @find(model: "Blog", scopes: ["published"])

    "List multiple public blog posts."
    blogsPublic(
        "Filters by author name, title, and tags."
        author: String @scope(name: "authorName")
        title: String @where(operator: "like")
        hasTags: [String!] @scope
        orderBy: _ @orderBy(columns: ["created_at", "updated_at", "title"])
    ): [BlogPublic!]!
        @paginate(
            defaultCount: 10
            builder: "App\\GraphQL\\Resolvers\\BlogResolver@publishedBuilder"
        )
}
