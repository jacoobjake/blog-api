extend type Query {
    "List author profiles available to the current user."
    authorProfiles(
        "Filters by name. Accepts SQL LIKE wildcards `%` and `_`."
        name: String @where(operator: "like")
        orderBy: _ @orderBy(columns: ["name", "created_at"])
    ): [AuthorProfile!]!
        @paginate(
            defaultCount: 50
            builder: "App\\GraphQL\\Resolvers\\AuthorProfileResolver@builder"
        )
        @guard

    "Find a single author profile by id."
    authorProfile(id: ID!): AuthorProfile
        @guard
        @field(resolver: "App\\GraphQL\\Resolvers\\AuthorProfileResolver@findAuthorProfile")
}
