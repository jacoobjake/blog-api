extend type Query {
    asset("Get by asset UUID" uuid: String! @eq): Asset
        @policy(check: RESOLVED_VALUE, ability: "view")
        @find(model: "App\\Models\\Asset")

    assets("Filter by asset type." type: AssetType): [Asset!]!
        @policy(check: MODEL_CLASS, model: "App\\Models\\Asset", ability: "viewAny")
        @paginate(
            defaultCount: 20
            builder: "App\\GraphQL\\Builders\\ScopedListBuilder@assets"
        )
}
